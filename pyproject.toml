[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debug-agent-mvp"
version = "0.1.0"
description = "Autonomous multi-agent debugging system with AST-guided RAG, blind antagonist audit, and CoW sandbox execution."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Adolpho Igor Benazzi Rodrigues" }
]

dependencies = [
    "langgraph>=0.2.0,<0.3.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "google-genai>=0.8.0<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "qdrant-client>=1.9.0,<2.0.0",
    "fastembed>=0.3.0,<0.4.0",
    "tree-sitter-languages>=1.10.0,<2.0.0",
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "debugpy>=1.8.0",
    "mypy>=1.10.0,<2.0.0",
    "ruff>=0.16.8,<1.0.0",
]

[tool.pytest.ini_options]
# Automatically adds these directories to sys.path during test collection
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = ["E501"]

[tool.uv]
package = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
