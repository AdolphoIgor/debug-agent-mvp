[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debug-agent-mvp"
version = "0.1.0"
description = "Autonomous multi-agent debugging system with AST-guided RAG, blind antagonist audit, and hermetic sandbox execution."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Adolpho Igor Benazzi Rodrigues" }
]

dependencies = [
    "langgraph>=0.6.0",
    "psycopg2-binary>=2.9.10",
    "google-genai>=0.8.0",
    "pydantic>=2.10.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "tree-sitter-languages>=1.10.0",
    "mcp[cli]>=1.3.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-api>=0.14.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "debugpy>=1.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "debugpy>=1.8.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-api>=0.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q -ra --strict-markers --disable-warnings"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]
ignore = ["E501"]

[tool.uv]
package = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true