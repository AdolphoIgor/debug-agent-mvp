services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: client_baseline_db
      POSTGRES_USER: mvp_user
      POSTGRES_PASSWORD: mvp_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mvp_user -d client_baseline_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mvp_global_net

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: mvp_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mvp_global_net

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mvp-mcp-server:latest
    container_name: mvp_mcp_server
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TARGET_DB_URL: postgresql://mvp_user:mvp_password@postgres:5432/client_baseline_db
      PYTHONUNBUFFERED: "1"
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8080"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mvp_global_net

  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: mvp-sandbox:latest
    container_name: mvp_sandbox_base
    pull_policy: build
    restart: "no"
    network_mode: none

networks:
  mvp_global_net:
    name: mvp_global_net
    driver: bridge

volumes:
  postgres_data:
    name: mvp_postgres_data
  qdrant_data:
    name: mvp_qdrant_data
