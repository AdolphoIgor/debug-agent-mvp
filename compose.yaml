networks:
  mvp_global_net:
    name: ${DOCKER_NETWORK_NAME:-mvp_global_net}
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvp_password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mvp_user} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mvp_global_net

  db-init:
    image: postgres:16-alpine
    container_name: mvp_db_init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-mvp_password}
      POSTGRES_USER: ${POSTGRES_USER:-mvp_user}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mvp_db}
      BASELINE_DB_NAME: ${BASELINE_DB_NAME:-client_baseline_db}
    volumes:
      - ./database:/database:ro
    networks:
      - mvp_global_net
    entrypoint: >
      /bin/sh -c " set -e; echo 'Waiting for PostgreSQL readiness...'; until pg_isready -h $$POSTGRES_HOST -p 5432 -U $$POSTGRES_USER; do
        sleep 1;
      done;

      echo 'Checking existence of baseline database: '$$BASELINE_DB_NAME; EXISTS_BASELINE=$$(psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = '$$BASELINE_DB_NAME'\" | tr -d '[:space:]'); if [ \"$$EXISTS_BASELINE\" != \"1\" ]; then
        echo 'Creating baseline database for Copy-on-Write cloning...';
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d postgres -c \"CREATE DATABASE $$BASELINE_DB_NAME;\";
      else
        echo 'Baseline database already exists.';
      fi;

      echo 'Checking existence of operational database: '$$POSTGRES_DB; EXISTS_MVP=$$(psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB'\" | tr -d '[:space:]'); if [ \"$$EXISTS_MVP\" != \"1\" ]; then
        echo 'Creating operational database: '$$POSTGRES_DB;
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d postgres -c \"CREATE DATABASE $$POSTGRES_DB;\";
      else
        echo 'Operational database already exists.';
      fi;

      echo 'Inspecting relational schema structure in '$$POSTGRES_DB'...'; SCHEMA_INITIALIZED=$$(psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB -tc \"SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'code_symbols'\" | tr -d '[:space:]'); if [ \"$$SCHEMA_INITIALIZED\" != \"1\" ]; then
        echo 'Relational schema not detected. Applying database/schema.sql...';
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB -f /database/schema.sql;
        echo 'Relational schema provisioned successfully.';
      else
        echo 'Relational schema already detected. Skipping DDL execution.';
      fi; "

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: mvp_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mvp_global_net

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_mcp_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TARGET_DB_URL: ${TARGET_DB_URL:-postgresql://mvp_user:mvp_password@postgres:5432/client_baseline_db}
      PYTHONPATH: ${PYTHONPATH:-/workspace/src}
    command: python src/mcp_db_server.py
    ports:
      - "${MCP_SERVER_PORT:-8080}:8080"
    networks:
      - mvp_global_net

  record-proxy:
    image: python:3.11-slim
    container_name: mvp_record_proxy
    restart: unless-stopped
    command: python -c "import http.server, socketserver; handler = http.server.SimpleHTTPRequestHandler; socketserver.TCPServer(('0.0.0.0', 8080), handler).serve_forever()"
    expose:
      - "8080"
    ports:
      - "${RECORD_PROXY_PORT:-8081}:8080"
    networks:
      - mvp_global_net

  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: mvp-sandbox:latest
    pull_policy: build
    restart: "no"
    network_mode: none

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_dev_workspace
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      mcp-server:
        condition: service_started
      record-proxy:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mvp_user:mvp_password@postgres:5432/mvp_db}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mvp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvp_password}
      BASELINE_DB_NAME: ${BASELINE_DB_NAME:-client_baseline_db}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MCP_SERVER_SSE_URL: ${MCP_SERVER_SSE_URL:-http://mcp-server:8080/sse}
      MVP_RECORD_PLAY_PROXY_URL: ${MVP_RECORD_PLAY_PROXY_URL:-http://record-proxy:8080}
      PYTHONPATH: ${PYTHONPATH:-/workspace/src}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-debug-agent-mvp}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-120}
      DOCKER_NETWORK_NAME: ${DOCKER_NETWORK_NAME:-mvp_global_net}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-mvp-sandbox:latest}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mvp_global_net