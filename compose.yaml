services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvp_password}
      POSTGRES_DB: ${POSTGRES_DB:-mvp_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mvp_user} -d ${POSTGRES_DB:-mvp_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mvp_global_net

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: mvp_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mvp_global_net

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-server:latest
    container_name: mvp_mcp_server
    restart: unless-stopped
    command: [ "python", "src/mcp_code_server.py" ]
    environment:
      WORKSPACE_ROOT: /workspace
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mvp_db}
      POSTGRES_USER: ${POSTGRES_USER:-mvp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvp_password}
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8080
    volumes:
      - .:/workspace
    ports:
      - "${MCP_SERVER_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - mvp_global_net

  orchestrator-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: orchestrator-app:latest
    container_name: mvp_orchestrator_app
    restart: unless-stopped
    command: [ "python", "-m", "uvicorn", "src.api_server:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      WORKSPACE_ROOT: /workspace
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mvp_db}
      POSTGRES_USER: ${POSTGRES_USER:-mvp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvp_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mvp_user}:${POSTGRES_PASSWORD:-mvp_password}@postgres:5432/${POSTGRES_DB:-mvp_db}
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_SSE_URL: http://mcp-server:8080/sse
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-mvp-sandbox:latest}
      SANDBOX_TIMEOUT_SEC: ${SANDBOX_TIMEOUT_SEC:-120}
      DOCKER_NETWORK_NAME: mvp_global_net
      PYTHONPATH: /workspace:/workspace/src
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mcp-server:
        condition: service_started
    networks:
      - mvp_global_net

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: ${SANDBOX_IMAGE:-mvp-sandbox:latest}
    pull_policy: build
    restart: "no"
    network_mode: none
    profiles:
      - tools
      - sandbox

networks:
  mvp_global_net:
    name: mvp_global_net
    driver: bridge

volumes:
  postgres_data:
    name: mvp_postgres_data
  qdrant_data:
    name: mvp_qdrant_data
